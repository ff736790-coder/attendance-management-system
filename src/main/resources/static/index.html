<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Attendance Management System</h1>
    <p class="subtitle">Add students and record daily attendance.</p>

    <form id="attendanceForm">
      <label>Student Name
        <input id="studentName" required placeholder="Enter student name">
      </label>
      <label>Roll Number
        <input id="rollNumber" required placeholder="Enter roll number">
      </label>
      <label>Date
        <input id="attendanceDate" type="date" required>
      </label>
      <label>Attendance Status
        <select id="status">
          <option value="Present">Present</option>
          <option value="Absent">Absent</option>
          <option value="Late">Late</option>
        </select>
      </label>
      <button type="submit">Save Attendance</button>
      <p id="message" role="status"></p>
    </form>

    <h2>Attendance Records</h2>
    <button id="refreshButton" type="button">Refresh Records</button>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Roll No.</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="records"></tbody>
      </table>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
